[package]
name = "edex-ui-rs"
version = "0.1.0"
edition = "2021"
description = "Port di eDEX-UI da Electron a Rust (egui + OpenGL), pensato per PC vecchi"

[dependencies]
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts"] }
portable-pty = "0.8"
vt100 = "0.15"
sysinfo = "0.30"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_json = "1"
regex = "1"
flate2 = "1"
arboard = { version = "3", default-features = false }
rodio = { version = "0.19", default-features = false, features = ["wav"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
